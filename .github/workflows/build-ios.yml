name: Build & Package iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned Release .app
        run: |
          xcodebuild \
            -project GoogleCalculator.xcodeproj \
            -scheme GoogleCalculator \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/GoogleCalculator.app Payload/
          zip -r GoogleCalculator.ipa Payload
          ls -lh GoogleCalculator.ipa

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleCalculator-iOS-IPA
          path: GoogleCalculator.ipa
          retention-days: 30

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GoogleCalculator.ipa
